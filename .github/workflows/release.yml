name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: ctk
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: ctk
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ctk.exe

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../../../ctk-${{ matrix.target }}.zip ${{ matrix.binary }}
          else
            tar czf ../../../ctk-${{ matrix.target }}.tar.gz ${{ matrix.binary }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctk-${{ matrix.target }}
          path: ctk-${{ matrix.target }}.*

  checksums:
    name: Compute SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    outputs:
      source_sha256: ${{ steps.source.outputs.sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Compute SHA256SUMS for binaries
        run: |
          find artifacts -type f | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Compute source tarball SHA256
        id: source
        run: |
          TAG=${GITHUB_REF_NAME}
          URL="https://github.com/jackymint/cliTokenKill/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula SHA
        run: |
          TAG=${GITHUB_REF_NAME}
          SHA=${{ steps.source.outputs.sha256 }}
          sed -i "s/sha256 \".*\"/sha256 \"${SHA}\"/" Formula/ctk.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ctk.rb
          git diff --cached --quiet || git commit -m "Release ${TAG}: update Homebrew formula SHA256"
          git push origin HEAD:main

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHA256SUMS
          path: SHA256SUMS

  release:
    name: Create Release
    needs: checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
